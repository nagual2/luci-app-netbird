name: Build release packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_arch: x86_64
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/x86/64/openwrt-sdk-25.12.5-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          - target_arch: aarch64_cortex-a53
            sdk_url: https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/filogic/openwrt-sdk-25.12.5-mediatek-filogic_gcc-14.3.0_musl.Linux-x86_64.tar.zst
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq curl zstd rsync make bash

      - name: Build APK
        env:
          SDK_URL: ${{ matrix.sdk_url }}
          # Must live outside the workspace: the script rsyncs the repo into
          # the SDK feed, an in-workspace SDK would copy itself into itself.
          SDK_DIR: ${{ runner.temp }}/openwrt-sdk
        run: bash scripts/build-apk-sdk.sh

      - name: Rename artifacts per arch
        run: |
          cd dist
          for f in netbird*.apk; do
            mv "$f" "${f%.apk}_${{ matrix.target_arch }}.apk"
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: netbird-packages-${{ matrix.target_arch }}
          path: dist/*
          retention-days: 90

  # After a green build of main: tag the commit with v<PKG_VERSION>.
  # Created via API on purpose - an API-made tag does not trigger another
  # workflow run, unlike a git push of the tag.
  tag:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create version tag if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v$(sed -n 's/^PKG_VERSION:=//p' Makefile)"
          if git ls-remote --exit-code --tags origin "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping"
          else
            gh api "repos/${{ github.repository }}/git/refs" \
              -f ref="refs/tags/${VERSION}" \
              -f sha="${{ github.sha }}"
            echo "Created tag ${VERSION} at ${{ github.sha }}"
          fi

  release:
    needs: build
    # Actor guard keeps the auto-tag above from ever producing a release.
    if: >-
      github.event_name == 'push' &&
      startsWith(github.ref, 'refs/tags/v') &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Download all package artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: netbird-packages-*
          merge-multiple: true

      - name: Attach packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          overwrite_files: true
